- rule: Constantine_Inbound_Or_Reverse_Shell_Connection
  desc: Intento de conexión interactiva de shell reversa / socket sospechoso
  condition: (proc.name in (nc, ncat, netcat) and proc.cmdline contains "-e") or (proc.cmdline contains "/dev/tcp/")
  output: "Intento de conexión interactiva de shell reversa / socket sospechoso (proc=%proc.cmdline fd=%fd.name pid=%proc.pid)"
  priority: EMERGENCY
  tags: [network, shell, c2]

- rule: Constantine_Suspicious_Privilege_Escalation
  desc: Operación sospechosa de elevación de privilegios detectada
  condition: (proc.name in (pkexec, sudo, su) and proc.cmdline contains "/bin/sh") or (proc.euid = 0 and proc.uid != 0)
  output: "Operación sospechosa de elevación de privilegios detectada (user=%user.name uid=%user.uid euid=%user.euid proc=%proc.cmdline ppid=%proc.ppid)"
  priority: WARNING
  tags: [privilege_escalation, host]

- rule: Constantine_Credential_Or_Namespace_Tampering
  desc: Intento no autorizado de alteración de credenciales o namespace de kernel
  condition: syscall.type in (setuid, setgid, unshare, setns) and proc.name contains "exploit"
  output: "Intento no autorizado de alteración de credenciales o namespace de kernel (user=%user.name syscall=%syscall.type proc=%proc.cmdline)"
  priority: CRITICAL
  tags: [kernel, credentials, tampering]

- rule: Constantine_Unexpected_Outbound_Network_Connection
  desc: Conexión de red inesperada hacia puerto sospechoso
  condition: fd.dport in (4444, 5555, 6666, 9001, 1337) and not proc.name in (ssh, curl, wget)
  output: "Conexión de red inesperada hacia puerto sospechoso (proc=%proc.cmdline connection=%fd.name dport=%fd.dport pid=%proc.pid)"
  priority: CRITICAL
  tags: [network, exfiltration]

- rule: Constantine_Execution_From_Temporary_Directory
  desc: Ejecución de binario no reconocido desde directorio temporal
  condition: (proc.cmdline startswith "/tmp/" or proc.cmdline startswith "/var/tmp/") and not proc.name in (apt, dpkg)
  output: "Ejecución sospechosa desde ruta temporal (proc=%proc.cmdline pid=%proc.pid)"
  priority: WARNING
  tags: [execution, dropper]

- rule: Constantine_Sensitive_File_Tampering
  desc: Intento de modificación sobre archivos sensibles del sistema
  condition: fd.name in (/etc/shadow, /etc/passwd, /etc/sudoers) and evt.type in (open, write)
  output: "Modificación sobre archivo sensible (file=%fd.name proc=%proc.cmdline)"
  priority: CRITICAL
  tags: [persistence, system]
