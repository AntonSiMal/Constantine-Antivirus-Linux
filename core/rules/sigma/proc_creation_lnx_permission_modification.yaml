title: Dangerous File Permission and SUID Modification
id: 7c2a1101-8b3d-4e92-b011-893a74c20003
status: stable
description: Detects modification of file permissions, specifically adding SUID/SGID bits or granting dangerous world-writable access to critical paths.
author: Sigma Community / Constantine EDR Team
date: 2026-11-05
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/
tags:
  - attack.privilege_escalation
  - attack.t1548.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_suid:
    Image|endswith:
      - 'chmod'
    CommandLine|contains:
      - 'u+s'
      - 'g+s'
      - '+s'
      - '4755'
      - '4777'
  selection_permissive:
    Image|endswith:
      - 'chmod'
    CommandLine|contains:
      - '777'
      - 'a+rwx'
  selection_target:
    CommandLine|contains:
      - '/bin/'
      - '/sbin/'
      - '/usr/bin/'
      - '/usr/sbin/'
      - '/etc/'
  condition: (selection_suid or selection_permissive) and selection_target
falsepositives:
  - Package installation scripts and legitimate system setup tools
level: high
