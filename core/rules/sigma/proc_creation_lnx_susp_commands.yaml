title: Suspicious Shell and Download Cradle Command Execution
id: 7c2a1101-8b3d-4e92-b011-893a74c20001
status: stable
description: Detects suspicious Linux command line patterns such as downloading content and piping directly into shell or base64 decoded execution.
author: Sigma Community / Constantine EDR Team
date: 2026-11-05
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_tool:
    CommandLine|contains:
      - 'curl'
      - 'wget'
  selection_pipe:
    CommandLine|contains:
      - '| bash'
      - '| sh'
      - '|/bin/bash'
      - '|/bin/sh'
      - '| python'
      - '| perl'
  selection_b64:
    CommandLine|contains:
      - 'base64 -d'
      - 'base64 --decode'
  selection_netcat:
    CommandLine|contains:
      - 'nc -e /bin/'
      - 'nc -e /usr/bin/'
      - 'nc -e /bin/sh'
      - 'nc -e /bin/bash'
      - 'ncat -e /bin/sh'
      - 'ncat -e /bin/bash'
      - 'nc -e sh'
      - 'nc -e bash'
  condition: (selection_tool and selection_pipe) or (selection_b64 and selection_pipe) or selection_netcat
falsepositives:
  - Legitimate automated deployment scripts that pipe installer to bash
level: critical
