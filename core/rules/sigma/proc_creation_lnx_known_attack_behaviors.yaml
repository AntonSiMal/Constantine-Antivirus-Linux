title: Known Linux Privilege Escalation and Discovery Tool Activity
id: 7c2a1101-8b3d-4e92-b011-893a74c20006
status: stable
description: Detects execution of automated Linux enumeration scripts or credential dumping tools commonly utilized in post-exploitation (LinPEAS, pspy, sudo without password enum).
author: Sigma Community / Constantine EDR Team
date: 2026-11-05
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/
tags:
  - attack.discovery
  - attack.t1082
  - attack.credential_access
  - attack.t1003.008
logsource:
  category: process_creation
  product: linux
detection:
  selection_tools:
    CommandLine|contains:
      - 'linpeas.sh'
      - 'linpeas'
      - 'pspy64'
      - 'pspy32'
      - 'les.sh'
      - 'linux-exploit-suggester'
  selection_cred_dump:
    CommandLine|contains:
      - '/etc/shadow'
      - '/etc/gshadow'
      - 'unshadow '
      - 'john '
      - 'hashcat '
  selection_sudo_enum:
    CommandLine|contains:
      - 'sudo -l'
      - 'sudo -n -l'
  condition: selection_tools or selection_cred_dump or selection_sudo_enum
falsepositives:
  - Authorized internal penetration testing or compliance audits
level: critical
