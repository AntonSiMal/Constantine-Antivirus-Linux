# ==============================================================================
# Constantine Falco Rules: Suspicious Privilege Operations
# Reglas de detección de comportamiento de llamadas al sistema para escalada de privilegios
# ==============================================================================

- rule: Constantine_Suspicious_Privilege_Escalation
  desc: Detecta ejecución sospechosa de utilidades de elevación de privilegios o cambios anómalos de EUID
  condition: >
    spawned_process and (proc.name in (pkexec, su, sudo, setuid) or user.uid != user.euid) and not proc.pname in (systemd, gdm-session-worker)
  output: "Operación sospechosa de elevación de privilegios detectada (user=%user.name uid=%user.uid euid=%user.euid proc=%proc.cmdline ppid=%proc.ppid)"
  priority: WARNING
  tags: [privilege, security, host, execution]

- rule: Constantine_Credential_Or_Namespace_Tampering
  desc: Detecta intentos de alteración de credenciales en memoria o evasión de namespaces
  condition: >
    syscall.type in (setuid, setgid, setresuid, setresgid, capset, unshare, setns) and user.uid != 0
  output: "Intento no autorizado de alteración de credenciales o namespace de kernel (user=%user.name syscall=%syscall.type proc=%proc.cmdline)"
  priority: CRITICAL
  tags: [privilege, namespace, kernel, security]
