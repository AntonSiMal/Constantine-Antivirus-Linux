apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "constantine-block-reverse-shells"
  namespace: "kube-system"
spec:
  kprobes:
    - call: "sys_enter_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
        - index: 1
          type: "string"
      selectors:
        - matchArgs:
            - index: 1
              operator: "Prefix"
              values:
                - "nc -e"
                - "ncat --exec"
                - "bash -i"
          matchActions:
            - action: "Sigkill"
            - action: "Override"
              argError: -13 # -EACCES
