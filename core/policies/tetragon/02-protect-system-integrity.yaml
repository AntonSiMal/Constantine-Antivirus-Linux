apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "constantine-protect-system-integrity"
  namespace: "kube-system"
spec:
  kprobes:
    - call: "sys_enter_openat"
      syscall: true
      args:
        - index: 1
          type: "string"
        - index: 2
          type: "int"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/etc/shadow"
                - "/etc/sudoers"
                - "/etc/ld.so.preload"
          matchActions:
            - action: "Override"
              argError: -13 # -EACCES
            - action: "Sigkill"
    - call: "sys_enter_unlinkat"
      syscall: true
      args:
        - index: 1
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/etc/pam.d/"
                - "/etc/security/"
          matchActions:
            - action: "Override"
              argError: -13 # -EACCES
            - action: "Sigkill"
