apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "constantine-network-egress-monitoring"
  namespace: "kube-system"
spec:
  kprobes:
    - call: "tcp_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
      selectors:
        - matchArgs: []
          matchActions:
            - action: "Post"
