[package]
name = "constantine"
version = "3.2.7"
edition = "2021"
authors = ["Constantine Antivirus Team"]
description = "Constantine Antivirus & EDR v3.2.7"

[[bin]]
name = "constantine"
path = "constantine.rs"

[dependencies]
gtk4 = "0.8"
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"] }
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
hex = "0.4"
