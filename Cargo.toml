[package]
name         = "constantine"
version      = "3.2.7"
edition      = "2021"
rust-version = "1.70"
authors      = ["Constantine Antivirus Team"]
description  = "Constantine Antivirus & EDR v3.2.7"

[[bin]]
name = "constantine"
path = "constantine.rs"

[dependencies]
gtk4       = "0.8"          # requiere GTK >= 4.10  y  Rust >= 1.70
serde_json = "1.0"
sha2       = "0.10"
aes-gcm    = "0.10"
getrandom  = "0.2"
hex        = "0.4"
