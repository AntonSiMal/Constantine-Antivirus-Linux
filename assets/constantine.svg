<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#dc2626" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Outline with Glow -->
  <path d="M128 16 C176 40 224 44 224 104 C224 180 156 228 128 244 C100 228 32 180 32 104 C32 44 80 40 128 16 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" stroke="#fca5a5" stroke-width="4"/>

  <!-- Inner Dark Core -->
  <path d="M128 32 C168 52 208 56 208 106 C208 168 150 212 128 226 C106 212 48 168 48 106 C48 56 88 52 128 32 Z" 
        fill="#0f172a" stroke="#ef4444" stroke-width="2"/>

  <!-- Constantine Cyber Sword Motif -->
  <!-- Blade -->
  <polygon points="128,48 134,168 128,184 122,168" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="128" y1="48" x2="128" y2="184" stroke="#0284c7" stroke-width="2"/>
  
  <!-- Guard -->
  <rect x="96" y="166" width="64" height="8" rx="4" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="1"/>
  
  <!-- Hilt / Handle -->
  <rect x="124" y="174" width="8" height="24" rx="2" fill="#334155"/>
  
  <!-- Pommel -->
  <circle cx="128" cy="204" r="6" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="1"/>

  <!-- Digital Circuit Nodes -->
  <circle cx="84" cy="112" r="4" fill="#38bdf8"/>
  <circle cx="172" cy="112" r="4" fill="#38bdf8"/>
  <circle cx="96" cy="144" r="3.5" fill="#38bdf8"/>
  <circle cx="160" cy="144" r="3.5" fill="#38bdf8"/>
  
  <!-- Circuit Traces -->
  <path d="M84 112 L108 124 L122 124" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M172 112 L148 124 L134 124" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M96 144 L114 150 L122 150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M160 144 L142 150 L134 150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
