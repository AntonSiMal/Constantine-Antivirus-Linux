<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Solo root y el usuario de servicio de Constantine pueden poseer el nombre en el bus de sistema -->
  <policy user="root">
    <allow own="org.constantine.antivirus"/>
    <allow send_destination="org.constantine.antivirus"/>
    <allow receive_sender="org.constantine.antivirus"/>
  </policy>

  <!-- Política predeterminada restrictiva para todos los demás usuarios (Least Privilege) -->
  <policy context="default">
    <!-- Denegar envío por defecto para impedir ejecución arbitraria -->
    <deny send_destination="org.constantine.antivirus"/>

    <!-- Permitir estrictamente métodos de solo lectura e información de estado -->
    <allow send_destination="org.constantine.antivirus"
           send_interface="org.constantine.antivirus.Status"
           send_member="GetStatus"/>
    <allow send_destination="org.constantine.antivirus"
           send_interface="org.constantine.antivirus.Status"
           send_member="GetThreats"/>
    <allow send_destination="org.constantine.antivirus"
           send_interface="org.constantine.antivirus.Status"
           send_member="GetAuditLogs"/>
    <allow send_destination="org.constantine.antivirus"
           send_interface="org.constantine.antivirus.Scan"
           send_member="RequestScan"/>

    <!-- Métodos administrativos bloqueados por defecto; requieren autorización explícita -->
    <deny send_destination="org.constantine.antivirus"
          send_interface="org.constantine.antivirus.Admin"/>
  </policy>

  <!-- Permitir a miembros del grupo administrativo enviar comandos (sujetos a verificación Polkit) -->
  <policy group="sudo">
    <allow send_destination="org.constantine.antivirus"
           send_interface="org.constantine.antivirus.Admin"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="org.constantine.antivirus"
           send_interface="org.constantine.antivirus.Admin"/>
  </policy>
</busconfig>
